crog_actions:
  - name: LAN connection
    command: nc -z -w 2 {{ haproxy_config.backend }} 443
    tries: 3
    code: 0
    cron: "* * * * *"
    when:
      start: "{{ hc_lan }}/start"
      success: "{{ hc_lan }}"
      failure: "{{ hc_lan }}/fail"
  - name: VPN Interface Status
    command: wg show wg0
    tries: 3
    code: 0
    cron: "* * * * *"
    when:
      start: "{{ hc_conn }}/start"
      success: "{{ hc_conn }}"
      failure: "{{ hc_conn }}/fail"

crog_verbose: true

crog_server_ip: "{{ haproxy_config.ip }}"

alloy_server_enabled: false
alloy_loki_server_url: http://loki.monitoring.svc.cluster.local:3100

haproxy_stats_bind: "{{ haproxy_config.ip }}"
haproxy_stats_extras:
  - bind localhost:8404

haproxy_listeners: []

haproxy_resolvers:
  - name: netbird
    nameserver: "local-netbird {{ haproxy_config.ip }}:53"
    retries: 3
    timeout_resolve: 1s
    timeout_retry: 1s
    hold_valid: 10s
    hold_obsolete: 0s

haproxy_frontends:
  - name: http
    bind: "*:80"
    mode: tcp
    balance: leastconn
    backend: k3s-envoy
    extras:
      - option tcpka
    backendIf: []
  - name: https
    bind: "*:443"
    mode: tcp
    balance: leastconn
    extras:
      - option tcpka
      - tcp-request inspect-delay 5s
      - tcp-request content accept if { req.ssl_hello_type 1 }
    backend: k3s-envoy
    backendIf:
      - host: plex.plexmox.com
        backend: k3s-envoy-proxy-protocol

haproxy_backends:
  - name: k3s-envoy
    mode: tcp
    host: "public-gateway.gateways.k8s.talos.internal.:443"
    options: "check resolvers netbird resolve-prefer ipv4 init-addr last,libc,none"
  - name: k3s-envoy-proxy-protocol
    mode: tcp
    host: "public-gateway.gateways.k8s.talos.internal.:443"
    options: "check {{ 'send-proxy-v2' if haproxy_config.proxy }} resolvers netbird resolve-prefer ipv4 init-addr last,libc,none"

haproxy_port_checks:
  - name: public envoy gateway
    host: public-gateway.gateways.k8s.talos.internal.
    port: 443

wireguard_ip_forwarding: true
