stages:
  - lint
  - plan
  - deploy
  - renovate

image: ghcr.io/henrywhitaker3/containers/pipelines:v1.3.1

##############
# Kubernetes #
##############
diffs:
  stage: plan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - ./scripts/pipeline_changes.sh

###########
# Ansible #
###########
.playbooks:
  variables:
    ANSIBLE_CONFIG: ./ansible.cfg
    SOPS_AGE_KEY: $AGE_KEY
  parallel:
    matrix:
      - PLAYBOOK:
          - jump
          - adguard
          - proxmox
          - netbird
  rules:
    - if: $SKIP_ANSIBLE == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" && $ANSIBLE_RUN_ALL == "true"
    - if: $CI_COMMIT_BRANCH == "main" && $SKIP_ANSIBLE != "true"
      changes:
        - ansible/playbooks/$PLAYBOOK/*
        - ansible/playbooks/$PLAYBOOK/**/*
        - ansible/inventory/*
        - ansible/inventory/**/*
        - ansible/roles/**/*
        - ansible/inventory
        - .ansible-lint

ansible lint:
  stage: lint
  extends: .playbooks
  script:
    - task playbook="ansible/playbooks/$PLAYBOOK/main.yaml" ci:lint

ansible play:
  stage: deploy
  extends: .playbooks
  script:
    - eval $(ssh-agent -s)
    - task playbook="ansible/playbooks/$PLAYBOOK/main.yaml" ssh_key="$SSH_KEY" ci:playbook
  environment:
    name: "$PLAYBOOK"
