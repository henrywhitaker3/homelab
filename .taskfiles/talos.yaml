---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  kubeconfig:
    desc: Merge the kubeconfig with ~/.kube/config
    requires:
      vars:
        - stack
    cmds:
      - task: ctl
        vars:
          stack: "{{ .stack }}"
          CLI_ARGS: kubeconfig

  ctl:
    desc: Run talosctl commands
    requires:
      vars:
        - stack
    vars:
      config: /tmp/talos-{{ .stack }}.yaml
    silent: true
    cmds:
      - task tm:output module={{ .stack }} -- -raw talos_config > "{{ .config }}"
      - defer: rm "{{ .config }}"
      - talosctl --talosconfig "{{ .config }}" {{ .CLI_ARGS }}
