---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  kind: daemonset

  image:
    repository: ghcr.io/squat/generic-device-plugin
    pullPolicy: IfNotPresent
    tag: "a11f990"

  entrypoint:
    args:
      - --device
      - |
        name: igpu
        groups:
          - paths:
              - path: /dev/dri

  securityContext:
    privileged: true

  volumeMounts:
    - name: device-plugin
      mountPath: /var/lib/kubelet/device-plugins
    - name: dev
      mountPath: /dev

  volumes:
    - name: device-plugin
      hostPath:
        path: /var/lib/kubelet/device-plugins
    - name: dev
      hostPath:
        path: /dev

  tolerations:
    - operator: "Exists"
      effect: "NoExecute"
    - operator: "Exists"
      effect: "NoSchedule"

  service:
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 10Mi
    limits:
      memory: 20Mi
