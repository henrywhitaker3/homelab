---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 3
  kind: statefulset

  image:
    repository: ghcr.io/henrywhitaker3/ticktick-events
    pullPolicy: IfNotPresent
    tag: v2.0.3

  resources:
    requests:
      cpu: 15m
      memory: 24Mi

  probes:
    enabled: true
    type: httpGet
    options:
      path: /healthz
      port: metrics

  service:
    portName: metrics
    port: 8080

  metrics:
    enabled: true
    port: 8080
    path: /metrics

  env:
    - name: LOG_LEVEL
      value: debug
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: RUNTIME_HOST
      value: "$(POD_NAME).ticktick-peers"
    - name: RUNTIME_DB_URL
      valueFrom:
        secretKeyRef:
          name: crunchy-pguser-ticktick
          key: pgbouncer-uri
    - name: RUNTIME_PSK
      valueFrom:
        secretKeyRef:
          name: ticktick-secrets
          key: runtime-psk
    - name: TICKTICK_TOKEN
      valueFrom:
        secretKeyRef:
          name: ticktick-secrets
          key: ticktick-token
    - name: PAVLOK_TOKEN
      valueFrom:
        secretKeyRef:
          name: ticktick-secrets
          key: pavlok-token
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://alloy.monitoring.svc:4318
    - name: QUIET_TIMES_MONDAY
      value: &weekday "23:00:00-08:00:00"
    - name: QUIET_TIMES_TUESDAY
      value: *weekday
    - name: QUIET_TIMES_WEDNESDAY
      value: *weekday
    - name: QUIET_TIMES_THURSDAY
      value: *weekday
    - name: QUIET_TIMES_FRIDAY
      value: *weekday
    - name: QUIET_TIMES_SATURDAY
      value: &weekend "00:00:00-10:00:00"
    - name: QUIET_TIMES_SUNDAY
      value: *weekend
