---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: ghcr.io/bookorbit/bookorbit
    pullPolicy: IfNotPresent
    tag: 2.7.0

  service:
    port: 3000

  resources:
    requests:
      cpu: 250m
      memory: 256Mi

  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  httpRoute:
    enabled: true
    hostnames: [books.plexmox.com]
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: public
        namespace: gateways
    rules:
      - port: 3000
        matches:
          - path:
              type: PathPrefix
              value: /
        # BookOrbit sets its own CSP. Its frontend needs to follow the
        # external-auth redirect returned by TinyAuth.
        filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - name: Content-Security-Policy
                  value: "default-src 'self'; base-uri 'self'; font-src 'self' data: blob: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com; connect-src 'self' ws: wss: https://tiny.plexmox.com https://cdn.jsdelivr.net https://api.dictionaryapi.dev https://*.wiktionary.org https://translate.googleapis.com; media-src 'self' data: blob:; frame-src 'self' blob:; worker-src 'self' blob:"

  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: BOOK_DOCK_PATH
      value: /bookdrop
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: crunchy-pguser-bookorbit
          key: uri
    - name: APP_URL
      value: https://books.plexmox.com
    - name: CLIENT_URL
      value: https://books.plexmox.com
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: bookorbit-secrets
          key: jwt-secret
    - name: SETUP_BOOTSTRAP_TOKEN
      valueFrom:
        secretKeyRef:
          name: bookorbit-secrets
          key: setup-token

  pvc:
    enabled: true
    mountPath: /data
    storageClassName: longhorn
    size: 5Gi

  volumes:
    - name: books
      hostPath:
        path: /plex/Media/Booklore/books
    - name: bookdrop
      hostPath:
        path: /plex/Media/Booklore/bookdrop

  volumeMounts:
    - mountPath: /books
      name: books
    - mountPath: /bookdrop
      name: bookdrop

  deploymentStrategy:
    type: Recreate

  probes:
    enabled: true
    initialDelaySeconds: 30
    type: tcpSocket

  netpol:
    enabled: true
    allowCoredns: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: gateways
            podSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-name: public
        ports:
          - port: 3000
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
            podSelector:
              matchLabels:
                app.kubernetes.io/name: uptime-kuma
        ports:
          - port: 3000
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: crunchy
            podSelector:
              matchLabels:
                postgres-operator.crunchydata.com/cluster: crunchy
                postgres-operator.crunchydata.com/role: master
        ports:
          - port: 5432
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 10.0.0.0/8
        ports:
          - port: 443
