---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit-api
spec:
  hostnames:
    - books.plexmox.com
  rules:
    - backendRefs:
        - kind: Service
          name: orbit
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/opds
    - backendRefs:
        - kind: Service
          name: orbit
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/koreader
    - backendRefs:
        - kind: Service
          name: orbit
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /login
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateways
