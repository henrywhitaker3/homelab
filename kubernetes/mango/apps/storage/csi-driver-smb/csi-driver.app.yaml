apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-smb
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  namespace: argo
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: storage
  source:
    path: kubernetes/mango/apps/storage/csi-driver-smb/chart
    repoURL: https://gitlab.com/henrywhitaker3/homelab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
