---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        default-username: '{{ `{{ index . "default-username" }}` }}'
        default-password: '{{ `{{ index . "default-password" }}` }}'
        client-id: '{{ `{{ index . "client-id" }}` }}'
        client-secret: '{{ `{{ index . "client-secret" }}` }}'
        db-url: >-
          {{ `host='{{ index . "host" }}' port='{{ index . "port" }}' user='{{ index . "user" }}' dbname='{{ index . "dbname" }}' password='{{ index . "password" }}'` }}
  data:
    - remoteRef:
        key: gotify-secrets
        property: default-username
      secretKey: default-username
    - remoteRef:
        key: gotify-secrets
        property: default-password
      secretKey: default-password
    - remoteRef:
        key: gotify-secrets
        property: client-id
      secretKey: client-id
    - remoteRef:
        key: gotify-secrets
        property: client-secret
      secretKey: client-secret
  dataFrom:
    - extract:
        key: crunchy-pguser-gotify
