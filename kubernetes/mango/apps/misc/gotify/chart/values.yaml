---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: ghcr.io/gotify/server
    pullPolicy: IfNotPresent
    tag: "3.1.1"

  service:
    port: 8080

  httpRoute:
    enabled: true
    hostnames: [gotify.plexmox.com]
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: public
        namespace: gateways
    rules:
      - port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /

  probes:
    enabled: false

  env:
    - name: TZ
      value: Europe/London
    - name: GOTIFY_SERVER_PORT
      value: "8080"
    - name: GOTIFY_DATABASE_DIALECT
      value: "postgres"
    - name: GOTIFY_OIDC_ENABLED
      value: "true"
    - name: GOTIFY_OIDC_ISSUER
      value: "https://pocket.plexmox.com"
    - name: GOTIFY_OIDC_REDIRECTURL
      value: "https://gotify.plexmox.com/auth/oidc/callback"
    - name: GOTIFY_OIDC_AUTOREGISTER
      value: "true"
    - name: GOTIFY_OIDC_LINK_BY_USERNAME
      value: "true"
    - name: GOTIFY_LOCALAUTH_ENABLED
      value: "true"
    - name: GOTIFY_OIDC_IDP_NAME
      value: "Pocket ID"
    - name: GOTIFY_OIDC_GROUPS_ADMIN
      value: "ID-Admin"
    - name: GOTIFY_OIDC_SCOPES
      value: "openid,profile,email,groups"
    - name: GOTIFY_DEFAULTUSER_NAME
      valueFrom:
        secretKeyRef:
          name: gotify-secrets
          key: default-username
    - name: GOTIFY_DEFAULTUSER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: gotify-secrets
          key: default-password
    - name: GOTIFY_DATABASE_CONNECTION
      valueFrom:
        secretKeyRef:
          name: gotify-secrets
          key: db-url
    - name: GOTIFY_OIDC_CLIENTID
      valueFrom:
        secretKeyRef:
          name: gotify-secrets
          key: client-id
    - name: GOTIFY_OIDC_CLIENTSECRET
      valueFrom:
        secretKeyRef:
          name: gotify-secrets
          key: client-secret

  resources:
    requests:
      cpu: 5m
      memory: 50Mi
    limits:
      memory: 150Mi
