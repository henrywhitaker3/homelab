---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: alpine
    pullPolicy: Always
    tag: "latest"

  entrypoint:
    command: [tail, -f, /dev/null]

  volumes:
    - name: dns-shared
      emptyDir: {}

  initContainers:
    - name: init-dns-file
      image: alpine:latest
      command: ["/bin/sh", "-c", "touch /mnt/shared-dns/resolv.conf"]
      volumeMounts:
        - name: dns-shared
          mountPath: /mnt/shared-dns

  volumeMounts:
    - mountPath: /etc/resolv.conf
      name: dns-shared
      subPath: resolv.conf

  probes:
    enabled: false
