---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: alpine
    pullPolicy: Always
    tag: "latest"

  entrypoint:
    command: [tail, -f, /dev/null]

  volumes:
    - name: dns-shared
      emptyDir: {}

  volumeMounts:
    - mountPath: /etc/resolv.conf
      name: dns-shared
      subPath: resolv.conf

  probes:
    enabled: false
