---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: alpine
    pullPolicy: IfNotPresent
    tag: "latest"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  probes:
    enabled: false

  entrypoint:
    command: [tail, -f, /dev/null]

  volumes:
    - name: speedtest
      persistentVolumeClaim:
        claimName: speedtest

  volumeMounts:
    - mountPath: /data-temp
      name: speedtest
      readOnly: true
