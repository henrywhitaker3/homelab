---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: alpine
    pullPolicy: IfNotPresent
    tag: "latest"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  probes:
    enabled: false

  entrypoint:
    command: [tail, -f, /dev/null]

  volumes:
    - name: cifs
      csi:
        driver: smb.csi.k8s.io
        readOnly: true
        volumeAttributes:
          source: "//10.0.0.9/plex/Media/temp"
          secretName: k3s-smb

  volumeMounts:
    - mountPath: /data-temp
      name: cifs
      readOnly: true
