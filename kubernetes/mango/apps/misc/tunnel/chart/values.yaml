---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: alpine
    pullPolicy: IfNotPresent
    tag: "latest"

  entrypoint:
    command: [tail, -f, /dev/null]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  probes:
    enabled: false

  vpn:
    enabled: true
    secret:
      key: portugal-tunnel
      mount:
        path: /config/wg_confs
