netbird-operator:
  operator:
    image:
      repository: ghcr.io/netbirdio/netbird-operator
      tag: v0.8.0

  ingress:
    enabled: true
    router:
      enabled: true

  cluster:
    name: k3s-cluster

  managementURL: https://netbird.plexmox.com

  netbirdAPI:
    keyFromSecret:
      name: netbird-operator-secrets
      key: api-token
