netbird-operator:
  operator:
    image:
      repository: ghcr.io/netbirdio/netbird-operator
      tag: v0.8.0

  ingress:
    enabled: false
    router:
      enabled: false

  cluster:
    name: talos
    dns: k8s.talos.internal

  managementURL: https://netbird.plexmox.com

  netbirdAPI:
    keyFromSecret:
      name: netbird-operator-secrets
      key: api-token
