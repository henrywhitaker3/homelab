---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: tinyauth
  namespace: identity
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateways
    {{- range .Values.middlewares.pocket.namespaces }}
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: "{{ .name }}"
    {{- end }}
  to:
    - group: ""
      kind: Service
      name: tinyauth

{{- range .Values.middlewares.pocket.namespaces }}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pocket
  namespace: "{{ .name }}"
spec:
  targetRefs:
    {{- range .http }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: "{{ . }}"
    {{- end }}
  cors:
    allowOrigins:
      - "https://*.plexmox.com"
      - "https://*.henrywhitaker.com"
    allowMethods:
      - "*"
    allowHeaders:
      - "*"
    allowCredentials: true
  extAuth:
    headersToExtAuth:
      - cookie
      - x-forwarded-proto
      - x-forwarded-for
      - user-agent
    failOpen: false
    http:
      backendRefs:
        - name: tinyauth
          namespace: identity
          port: 3000
      path: /api/auth/envoy?path=
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
{{- end }}
