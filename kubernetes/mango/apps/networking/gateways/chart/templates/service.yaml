apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: public
    gateway.envoyproxy.io/owning-gateway-namespace: gateways
    gateway.networking.k8s.io/gateway-name: public
  name: public-gateway
  namespace: gateways
spec:
  type: ClusterIP
  ports:
    - name: http-80
      port: 80
      protocol: TCP
      targetPort: 10080
    - name: https-443
      port: 443
      protocol: TCP
      targetPort: 10443
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: public
    gateway.envoyproxy.io/owning-gateway-namespace: gateways
    gateway.networking.k8s.io/gateway-name: public
