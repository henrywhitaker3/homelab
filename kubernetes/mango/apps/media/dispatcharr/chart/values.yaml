---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: ghcr.io/dispatcharr/dispatcharr
    pullPolicy: IfNotPresent
    tag: 0.33.0

  service:
    port: 9191

  resources:
    requests:
      cpu: 50m
      memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  httpRoute:
    enabled: true
    hostnames: [dispatcharr.plexmox.com]
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: internal
        namespace: gateways
    rules:
      - port: 5055
        matches:
          - path:
              type: PathPrefix
              value: /
  env:
    - name: CELERY_BROKER_URL
      value: "redis://localhost:6379/0"
    - name: DISPATCHARR_ENV
      value: "aio"
    - name: DISPATCHARR_LOG_LEVEL
      value: "info"
    - name: DISPATCHARR_PORT
      value: "9191"
    - name: REDIS_HOST
      value: "localhost"

  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - mountPath: /tmp
      name: tmp

  pvc:
    enabled: true
    mountPath: /data
    storageClassName: longhorn
    size: 5Gi

  deploymentStrategy:
    type: Recreate

  probes:
    type: tcpSocket
    options:
      port: http

    initialDelaySeconds: 60

  netpol:
    enabled: true
    allowCoredns: true
    kind: cilium
    ciliumIngress:
      - fromEndpoints:
          - matchLabels:
              gateway.networking.k8s.io/gateway-name: public
              k8s:io.kubernetes.pod.namespace: gateways
        toPorts:
          - ports:
              - port: "9191"
