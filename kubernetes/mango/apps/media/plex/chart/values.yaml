---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: linuxserver/plex
    pullPolicy: IfNotPresent
    tag: "1.43.5@sha256:01a53d9c7adcbb3701fbb0a4230c0a37c85453759b6b05a67356c3c7a09de08d"

  resources:
    requests:
      cpu: 1000m
      memory: 512Mi
      devic.es/igpu: "1"
    limits:
      devic.es/igpu: "1"

  service:
    port: 32400

    additionalPorts:
      - name: dlna
        port: 1900
        protocol: UDP
        targetPort: dlna
      - name: bonjour
        port: 5353
        protocol: UDP
        targetPort: bonjour
      - name: roku
        port: 8324
        protocol: TCP
        targetPort: roku
      - name: gdm1
        port: 32410
        protocol: UDP
        targetPort: gdm1
      - name: gdm2
        port: 32412
        protocol: UDP
        targetPort: gdm2
      - name: gdm3
        port: 32413
        protocol: UDP
        targetPort: gdm3
      - name: gdm4
        port: 32414
        protocol: UDP
        targetPort: gdm4
      - name: dlnat
        port: 32469
        protocol: TCP
        targetPort: dlnat

  httpRoute:
    enabled: false
    hostnames: [plex.plexmox.com]
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: public
        namespace: gateways
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: internal
        namespace: gateways
    rules:
      - port: 32400
        matches:
          - path:
              type: PathPrefix
              value: /
      # Ref: https://forums.plex.tv/t/external-srt-subtitles-are-not-working-w-reverse-proxy/886540
      - port: 32400
        matches:
          - path:
              type: PathPrefix
              value: /library/streams
        filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              remove:
                - Range

  pvc:
    enabled: true
    mountPath: /config
    storageClassName: longhorn
    size: 100Gi

  deploymentStrategy:
    type: Recreate

  probes:
    type: tcpSocket
    options:
      port: http
    initialDelaySeconds: 20
    failureThreshold: 10

  config:
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/London
    VERSION: latest
    ADVERTISE_IP: https://plex.plexmox.com:443

  # securityContext:
  #   privileged: true

  additionalPorts:
    - name: dlna
      containerPort: 1900
      protocol: UDP
    - name: bonjour
      containerPort: 5353
      protocol: UDP
    - name: roku
      containerPort: 8324
      protocol: TCP
    - name: gdm1
      containerPort: 32410
      protocol: UDP
    - name: gdm2
      containerPort: 32412
      protocol: UDP
    - name: gdm3
      containerPort: 32413
      protocol: UDP
    - name: gdm4
      containerPort: 32414
      protocol: UDP
    - name: dlnat
      containerPort: 32469
      protocol: TCP

  volumes:
    - name: media
      csi:
        driver: smb.csi.k8s.io
        volumeAttributes:
          source: "//10.0.0.9/plex"
          secretName: k3s-smb
          mountOptions: "noserverino,cache=strict,uid=1000,gid=1000"
    - name: transcode
      emptyDir: {}

  volumeMounts:
    - mountPath: /plex
      name: media
    - mountPath: /transcode
      name: transcode

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - talos-mango-worker-4

  netpol:
    enabled: true
    kind: cilium
    allowCoredns: true
    ciliumIngress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring
              k8s:app.kubernetes.io/name: uptime-kuma
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: gateways
              k8s:gateway.networking.k8s.io/gateway-name: public
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: gateways
              k8s:gateway.networking.k8s.io/gateway-name: internal
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              k8s:app.kubernetes.io/name: sonarr
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              k8s:app.kubernetes.io/name: radarr
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              k8s:app.kubernetes.io/name: tautulli
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              k8s:app.kubernetes.io/name: seerr
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              k8s:app.kubernetes.io/name: plex-exporter
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              k8s:app.kubernetes.io/name: organizr
        toPorts:
          - ports:
              - port: "32400"
    ciliumEgress:
      - toFQDNs:
          - matchName: plex.bz
          - matchName: plex.tv
          - matchPattern: "*.plex.bz"
          - matchPattern: "*.pop.*.*.plex.bz"
          - matchPattern: "*.pop.*.plex.bz"
          - matchPattern: "*.plex.tv"
          - matchName: plex.itrescuefix.co.uk
          - matchName: www.opensubtitles.com
        toPorts:
          - ports:
              - port: "443"
      - toCIDR:
          - 239.255.255.250/32
        toPorts:
          - ports:
              - port: "1900"
                protocol: UDP
              - port: "32410"
                protocol: UDP
              - port: "32411"
                protocol: UDP
              - port: "32412"
                protocol: UDP
              - port: "32413"
                protocol: UDP
              - port: "32414"
                protocol: UDP
      - toCIDR:
          - 224.0.0.22/32
      - toCIDR:
          - 224.0.0.251/32
        toPorts:
          - ports:
              - port: "5353"
                protocol: UDP
      - toCIDR:
          - 255.255.255.255/32
        toPorts:
          - ports:
              - port: "65001"
                protocol: UDP
