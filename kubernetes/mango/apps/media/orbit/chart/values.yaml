---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 1

  image:
    repository: ghcr.io/bookorbit/bookorbit
    pullPolicy: IfNotPresent
    tag: 3.5.0

  service:
    port: 3000

  resources:
    requests:
      cpu: 250m
      memory: 256Mi

  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  httpRoute:
    enabled: true
    hostnames: [books.plexmox.com]
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: public
        namespace: gateways
    rules:
      - port: 3000
        matches:
          - path:
              type: PathPrefix
              value: /
      - filters:
          - type: ExtensionRef
            extensionRef:
              group: gateway.envoyproxy.io
              kind: HTTPRouteFilter
              name: bookorbit-404
        matches:
          - path:
              type: Exact
              value: /registerSW.js
          - path:
              type: Exact
              value: /sw.js

  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: BOOK_DOCK_PATH
      value: /bookdrop
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: crunchy-pguser-bookorbit
          key: uri
    - name: APP_URL
      value: https://books.plexmox.com
    - name: CLIENT_URL
      value: https://books.plexmox.com
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: bookorbit-secrets
          key: jwt-secret
    - name: SETUP_BOOTSTRAP_TOKEN
      valueFrom:
        secretKeyRef:
          name: bookorbit-secrets
          key: setup-token
    - name: BOOK_REQUEST_ENCRYPTION_KEY
      valueFrom:
        secretKeyRef:
          name: bookorbit-secrets
          key: requests-encryption-key

  pvc:
    enabled: true
    mountPath: /data
    storageClassName: longhorn
    size: 5Gi

  volumes:
    - name: books
      csi:
        driver: smb.csi.k8s.io
        volumeAttributes:
          source: "//10.0.0.9/plex/Media/Booklore/books"
          secretName: k3s-smb
          mountOptions: "noserverino,cache=strict,uid=1000,gid=1000"
    - name: bookdrop
      csi:
        driver: smb.csi.k8s.io
        volumeAttributes:
          source: "//10.0.0.9/plex/Media/Booklore/bookdrop"
          secretName: k3s-smb
          mountOptions: "noserverino,cache=strict,uid=1000,gid=1000"

  volumeMounts:
    - mountPath: /books
      name: books
    - mountPath: /bookdrop
      name: bookdrop

  deploymentStrategy:
    type: Recreate

  probes:
    enabled: true
    initialDelaySeconds: 30
    type: tcpSocket

  netpol:
    enabled: true
    kind: cilium
    allowCoredns: true
    ciliumIngress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: gateways
              k8s:gateway.networking.k8s.io/gateway-name: public
        toPorts:
          - ports:
              - port: "3000"
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring
              k8s:app.kubernetes.io/name: uptime-kuma
        toPorts:
          - ports:
              - port: "3000"
    ciliumEgress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: crunchy
              k8s:postgres-operator.crunchydata.com/cluster: crunchy
              k8s:postgres-operator.crunchydata.com/role: master
        toPorts:
          - ports:
              - port: "5432"
      - toFQDNs:
          - matchName: api.github.com
          - matchName: github.com
          - matchName: openlibrary.org
          - matchName: www.goodreads.com
          - matchName: api.hardcover.app
          - matchName: itunes.apple.com
          - matchName: www.amazon.com
          - matchName: assets.hardcover.app
          - matchName: m.media-amazon.com
        toPorts:
          - ports:
              - port: "443"
