---
# yaml-language-server: $schema=https://raw.githubusercontent.com/henrywhitaker3/crds/refs/heads/main/schemas/gateway.networking.k8s.io/experimental/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: organizr-redirect
spec:
  parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: public
        namespace: gateways
  hostnames: [plexmox.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: overseerr.plexmox.com
            scheme: https
            statusCode: 301
