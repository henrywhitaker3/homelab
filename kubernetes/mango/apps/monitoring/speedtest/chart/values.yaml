---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 2
  kind: statefulset

  image:
    repository: ghcr.io/henrywhitaker3/speedtest-tracker
    pullPolicy: IfNotPresent
    tag: v2.0.0

  service:
    port: 8080

  env:
    - name: ACCEPT_EULA
      value: "true"
    - name: DB_DRIVER
      value: postgres
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://alloy.monitoring.svc:4318
    - name: RUNTIME_PSK
      valueFrom:
        secretKeyRef:
          name: speedtest-secrets
          key: psk
    - name: DB_URL
      valueFrom:
        secretKeyRef:
          name: crunchy-pguser-speedtest
          key: pgbouncer-uri

  additionalPorts:
    - name: metrics
      containerPort: 8081
      protocol: TCP
    - name: francis
      containerPort: 7157

  httpRoute:
    enabled: true
    hostnames: [speedtest.plexmox.com]
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: internal
        namespace: gateways
    rules:
      - port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /

  probes:
    type: httpGet
    options:
      path: /readyz
    initialDelaySeconds: 60

  metrics:
    enabled: true
    port: metrics
    path: /metrics
