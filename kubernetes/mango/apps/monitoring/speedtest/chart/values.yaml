---
# yaml-language-server: $schema=https://henrywhitaker3.github.io/generic-helm-chart/subchart.schema.json
generic:
  replicaCount: 2
  kind: statefulset

  image:
    repository: ghcr.io/henrywhitaker3/speedtest-tracker
    pullPolicy: IfNotPresent
    tag: v2.7.0

  service:
    port: 8080
    additionalPorts:
      - name: metrics
        port: 8082
        protocol: TCP

  env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: RUNTIME_HOSTNAME
      value: "$(POD_NAME).speedtest-peers"
    - name: ACCEPT_EULA
      value: "true"
    - name: APP_URL
      value: "https://speedtest.henrywhitaker.com"
    - name: AUTH_ENABLED
      value: "true"
    - name: AUTH_ISSUER_URL
      value: https://pocket.plexmox.com
    - name: AUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: speedtest-secrets
          key: client-id
    - name: AUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: speedtest-secrets
          key: client-secret
    - name: DB_DRIVER
      value: postgres
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://alloy.alloy.svc:4318
    - name: RUNTIME_PSK
      valueFrom:
        secretKeyRef:
          name: speedtest-secrets
          key: psk
    - name: DB_URL
      valueFrom:
        secretKeyRef:
          name: crunchy-pguser-speedtest
          key: pgbouncer-uri
    - name: NOTIFICATIONS_HEALTHCHECKS
      valueFrom:
        secretKeyRef:
          name: speedtest-secrets
          key: healthchecks-url

  additionalPorts:
    - name: metrics
      containerPort: 8082
      protocol: TCP
    - name: francis
      containerPort: 7157

  httpRoute:
    enabled: true
    hostnames: [speedtest.henrywhitaker.com]
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: public
        namespace: gateways
    rules:
      - port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /

  probes:
    type: httpGet
    options:
      path: /readyz
      port: metrics
    initialDelaySeconds: 5

  metrics:
    enabled: true
    port: metrics
    path: /metrics

  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - mountPath: /tmp
      name: tmp

  podSecurityContext:
    runAsNonRoot: true
