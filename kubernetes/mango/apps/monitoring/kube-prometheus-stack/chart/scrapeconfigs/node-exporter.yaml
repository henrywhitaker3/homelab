apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter
spec:
  staticConfigs:
    - targets:
        - "adguard-1.lab:9100"
        - "adguard-2.lab:9100"
        - "jump-k8s.netbird.lab:9100"
        - "netbird.netbird.lab:9100"
        - "proxmox-1.lab:9100"
        - "proxmox-2.lab:9100"
        - "proxmox-3.lab:9100"
        - "unraid.lab:9100"
  metricsPath: /metrics
  relabelings:
    - targetLabel: job
      replacement: node_exporter
