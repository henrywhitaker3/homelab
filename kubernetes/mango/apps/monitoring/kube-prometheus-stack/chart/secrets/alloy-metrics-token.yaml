---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: v1
kind: Secret
metadata:
  name: alloy-metrics-token
  annotations:
    kubernetes.io/service-account.name: alloy
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
