---
# yaml-language-server: $schema=https://raw.githubusercontent.com/henrywhitaker3/crds/refs/heads/main/schemas/netbird.io/setupkey_v1alpha1.json
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: alloy
spec:
  allowExtraDnsLabels: false
  ephemeral: true
  name: alloy
  autoGroups:
    - name: talos
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/henrywhitaker3/crds/refs/heads/main/schemas/netbird.io/sidecarprofile_v1alpha1.json
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: alloy
spec:
  injectionMode: Sidecar
  setupKeyRef:
    name: alloy
  # Alloy reaches cluster and LAN addresses through Cilium.  Do not let
  # NetBird resource routes (including 10.0.0.2/32 and 10.0.0.3/32) take
  # precedence over those paths; direct NetBird peer connectivity remains on.
  containerOverride:
    env:
      - name: NB_DISABLE_CLIENT_ROUTES
        value: "true"
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
